name: Build and Push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source repository
      - name: Checkout source
        uses: actions/checkout@v6

      # 2. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t uastudio-build .

      # 3. Run Docker build
      #    dist/base on the runner is mounted into Docker
      - name: Build dist/base
        run: |
          mkdir -p "${{ github.workspace }}/dist/base"

          docker run --rm \
            -v "${{ github.workspace }}/dist/base:/home/n3/Proj/uastudio.site/dist/base" \
            uastudio-build

      # 4. Check generated files
      - name: Check build
        run: |
          echo "Generated files:"
          find dist/base -type f | head -50

      # 5. Checkout second repository
      - name: Checkout deployment repository
        uses: actions/checkout@v6
        with:
          repository: igavelyuk/prod-uastudio.site
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: deployment

      # 6. Replace deployment repository contents
      # - name: Copy build files
      #   run: |
      #     rm -rf deployment/*
      #     cp -a dist/base/. deployment/
      # 6. Replace contents of /prod
      - name: Copy build files
        run: |
          mkdir -p deployment/prod

          rm -rf deployment/prod/*
          cp -a dist/base/. deployment/prod/

      # 7. Commit and push deployment repository
      - name: Push deployment repository
        working-directory: deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi

          git commit -m "Deploy build from ${{ github.sha }}"
          git push
